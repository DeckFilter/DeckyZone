name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: stable
        options:
          - stable
          - prerelease
      bump:
        description: Stable version bump
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease_version:
        description: 'Pre-release version (for example: 0.7.0-pre.1)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deckyzone-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release selection
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          case "$RELEASE_CHANNEL" in
            stable)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo '::error::Dispatch stable releases from main only.'
                exit 1
              fi
              case "$RELEASE_BUMP" in
                patch|minor|major) ;;
                *) echo '::error::Unsupported version bump.'; exit 1 ;;
              esac
              ;;
            prerelease)
              if [[ "$GITHUB_REF" != refs/heads/* ]]; then
                echo '::error::Select a source branch for a pre-release.'
                exit 1
              fi
              ;;
            *) echo '::error::Unsupported release channel.'; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Test updater and release publication handling
        run: |
          python3 scripts/test-plugin-update.py
          python3 scripts/test-release-publish.py

      - name: Prepare version locally
        id: version
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_BUMP: ${{ inputs.bump }}
          PRERELEASE_VERSION: ${{ inputs.prerelease_version }}
        run: |
          if [ "$RELEASE_CHANNEL" = prerelease ]; then
            python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "py_modules")
          from release_versions import is_prerelease_version
          if not is_prerelease_version(os.environ["PRERELEASE_VERSION"]):
              raise SystemExit("Expected X.Y.Z-pre.N with a positive counter, such as 0.7.0-pre.1")
          PY
            pnpm run release:prepare "$PRERELEASE_VERSION"
          else
            pnpm run release:prepare "$RELEASE_BUMP"
          fi
          version="$(node -p "require('./package.json').version")"
          export RELEASE_VERSION="$version"
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, "py_modules")
          from release_versions import is_prerelease_version, parse_version, require_version
          version = os.environ["RELEASE_VERSION"]
          require_version(version)
          prerelease = os.environ["RELEASE_CHANNEL"] == "prerelease"
          if is_prerelease_version(version) != prerelease:
              raise SystemExit("Prepared version does not match the selected release channel")
          if prerelease:
              source = os.environ["GITHUB_SHA"]
              tags = subprocess.check_output(["git", "tag", "--merged", source], text=True).splitlines()
              stable_tags = [tag for tag in tags if tag.startswith("v")
                             and parse_version(tag, allow_tag=True) is not None
                             and not is_prerelease_version(tag, allow_tag=True)]
              # Supplying only valid stable tags keeps earlier prereleases out of the range boundary.
              if stable_tags:
                  args = ["git", "describe", "--tags", "--abbrev=0"]
                  args.extend("--match=" + tag for tag in stable_tags)
                  base = subprocess.check_output([*args, source], text=True).strip()
                  notes_range = f"{base}..{source}"
              else:
                  notes_range = source
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"notes_range={notes_range}\n")
          PY
          if git show-ref --verify --quiet "refs/tags/v${version}"; then
            echo '::error::This version is already tagged. Re-run failed jobs to reuse the original artifacts.'
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --use-branch-tags --strip all --unreleased --tag v${{ steps.version.outputs.version }} ${{ steps.version.outputs.notes_range }}
          github_token: ${{ github.token }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate full changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --use-branch-tags --tag v${{ steps.version.outputs.version }}
          github_token: ${{ github.token }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Type check
        run: pnpm exec tsc --noEmit --skipLibCheck

      - name: Build complete plugin
        run: pnpm run build

      - name: Package and validate both release archives
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release-package.py --output-dir "$RUNNER_TEMP/release" --source-sha "$GITHUB_SHA" --version "$RELEASE_VERSION"
          python3 scripts/release-package.py --verify "$RUNNER_TEMP/release"
          python3 scripts/release-package.py --verify-zip "$RUNNER_TEMP/release/DeckyZone.zip"

      - name: Transfer prepared release
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download original prepared release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
          digest-mismatch: error

      - name: Publish or resume verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/release-publish.py --release-dir "$RUNNER_TEMP/release" --source-sha "$GITHUB_SHA" --version "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY"
