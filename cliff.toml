# Adapted from the sibling hltb-for-deck changelog configuration.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    {% if commits | length > 0 %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits | unique(attribute="raw_message") %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}\
    {% endfor %}
    {% endif %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: (bump version|prepare release|release v?[0-9])", skip = true },
  { message = "^[a-z]+\\(deps[^)]*\\)", skip = true },
  { message = "^chore: (update dependencies|bump dependencies)", skip = true },
  { message = "^(feat|fix)\\((ci|build)\\)", group = "<!-- 4 -->🛠️ Maintenance" },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Fixes" },
  { message = "^doc", group = "<!-- 2 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^(refactor|style|test|ci|build|chore)", group = "<!-- 4 -->🛠️ Maintenance" },
  { message = ".*", group = "<!-- 4 -->🛠️ Maintenance" },
]
filter_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "DeckFilter"
repo = "DeckyZone"
